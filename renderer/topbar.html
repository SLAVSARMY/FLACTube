<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  /* Material 3 — тёмная монохромная схема (чёрно-серые тона YouTube) */
  :root {
    color-scheme: dark;
    --m3-primary: #CFCFCF;
    --m3-secondary-container: #3D3D3D;
    --m3-on-secondary-container: #EDEDED;
    --m3-surface-container: #212121;
    --m3-surface-container-high: #2B2B2B;
    --m3-on-surface: #EDEDED;
    --m3-on-surface-variant: #B3B3B3;
    --m3-error: #FFB4AB;
    --m3-ease: cubic-bezier(.2, 0, 0, 1);
  }
  * { box-sizing: border-box; margin: 0; user-select: none; }
  [hidden] { display: none !important; }
  body {
    height: 48px; background: var(--m3-surface-container);
    display: flex; align-items: center; gap: 2px; padding: 0 10px;
    font: 12px 'Segoe UI', Roboto, Arial, sans-serif; overflow: hidden;
  }
  button {
    width: 36px; height: 36px; flex: none; border: none; border-radius: 50%;
    background: transparent; color: var(--m3-on-surface-variant); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .18s var(--m3-ease), color .18s var(--m3-ease);
  }
  button svg { display: block; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.08); color: var(--m3-on-surface); }
  button:active:not(:disabled) { background: rgba(255,255,255,.12); }
  button:focus-visible { outline: 2px solid var(--m3-primary); outline-offset: 1px; }
  button:disabled { opacity: .28; cursor: default; }
  #urlwrap {
    flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; gap: 8px;
    margin: 0 8px; padding: 0 12px 0 14px; border-radius: 16px;
    background: var(--m3-surface-container-high);
  }
  #urlwrap svg { flex: none; color: var(--m3-on-surface-variant); opacity: .75; }
  #url {
    flex: 1; min-width: 0; border: none; background: transparent; outline: none;
    color: var(--m3-on-surface-variant); font: 12px 'Segoe UI', Roboto, Arial, sans-serif;
    user-select: text; white-space: nowrap; overflow: hidden;
  }
  #dlbtn { background: var(--m3-secondary-container); color: var(--m3-on-secondary-container); }
  #dlbtn:hover:not(:disabled) { background: #4A4A4A; color: var(--m3-on-secondary-container); }
  #restart:hover:not(:disabled) { color: var(--m3-error); }
</style>
</head>
<body>
<script>

const TB = {

  ru: { back: 'Назад (Alt+←)', fwd: 'Вперёд (Alt+→)', reload: 'Обновить (F5)', stop: 'Остановить', home: 'На главную', panel: 'Панель загрузок (F10)', restart: 'Перезапустить приложение целиком, если что-то зависло' },
  uk: { back: 'Назад (Alt+←)', fwd: 'Вперед (Alt+→)', reload: 'Оновити (F5)', stop: 'Зупинити', home: 'На головну', panel: 'Панель завантажень (F10)', restart: 'Перезапустити застосунок повністю, якщо щось зависло' },
  de: { back: 'Zurück (Alt+←)', fwd: 'Vorwärts (Alt+→)', reload: 'Neu laden (F5)', stop: 'Stoppen', home: 'Startseite', panel: 'Download-Panel (F10)', restart: 'Ganze App neu starten, falls etwas hängt' },
  fr: { back: 'Retour (Alt+←)', fwd: 'Avancer (Alt+→)', reload: 'Recharger (F5)', stop: 'Arrêter', home: 'Accueil', panel: 'Panneau de téléchargement (F10)', restart: 'Redémarrer l’app entière si quelque chose est bloqué' },

  tr: { back: 'Geri (Alt+←)', fwd: 'İleri (Alt+→)', reload: 'Yenile (F5)', stop: 'Durdur', home: 'Ana sayfa', panel: 'İndirme paneli (F10)', restart: 'Bir şey takıldıysa uygulamayı tamamen yeniden başlat' },
  ja: { back: '戻る (Alt+←)', fwd: '進む (Alt+→)', reload: '再読込 (F5)', stop: '停止', home: 'ホーム', panel: 'ダウンロードパネル (F10)', restart: '固まったらアプリ全体を再起動' },
  zh: { back: '后退 (Alt+←)', fwd: '前进 (Alt+→)', reload: '刷新 (F5)', stop: '停止', home: '主页', panel: '下载面板 (F10)', restart: '如果卡住了，重启整个应用' },
  ko: { back: '뒤로 (Alt+←)', fwd: '앞으로 (Alt+→)', reload: '새로 고침 (F5)', stop: '중지', home: '홈', panel: '다운로드 패널 (F10)', restart: '멈췄으면 앱 전체 재시작' },
  th: { back: 'ย้อนกลับ (Alt+←)', fwd: 'ไปข้างหน้า (Alt+→)', reload: 'รีเฟรช (F5)', stop: 'หยุด', home: 'หน้าแรก', panel: 'แผงดาวน์โหลด (F10)', restart: 'รีสตาร์ทแอปทั้งหมดถ้าค้าง' },
  vi: { back: 'Lùi (Alt+←)', fwd: 'Tới (Alt+→)', reload: 'Tải lại (F5)', stop: 'Dừng', home: 'Trang chủ', panel: 'Panel tải xuống (F10)', restart: 'Khởi động lại cả ứng dụng nếu bị treo' },
  id: { back: 'Kembali (Alt+←)', fwd: 'Maju (Alt+→)', reload: 'Muat ulang (F5)', stop: 'Hentikan', home: 'Beranda', panel: 'Panel unduhan (F10)', restart: 'Mulai ulang seluruh aplikasi bila macet' },
  hi: { back: 'पीछे (Alt+←)', fwd: 'आगे (Alt+→)', reload: 'रीलोड (F5)', stop: 'रोकें', home: 'होम', panel: 'डाउनलोड पैनल (F10)', restart: 'कुछ अटक जाए तो पूरा ऐप रीस्टार्ट करें' },
};
const TL = TB[(navigator.language || 'en').toLowerCase().split('-')[0]] || TB.en;
</script>
  <button id="back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
  <button id="forward">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
  </button>
  <button id="reload">
    <svg id="ic-refresh" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    <svg id="ic-stop" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>
  <button id="home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </button>
  <div id="urlwrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    <input id="url" readonly spellcheck="false">
  </div>
  <button id="dlbtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
  </button>
  <button id="restart">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 3h-2v10h2V3zm4.83 2.17-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
  </button>
<script>
const $ = (s) => document.querySelector(s);
const btn = { back: $('#back'), forward: $('#forward'), reload: $('#reload'), home: $('#home') };
const ic = { refresh: $('#ic-refresh'), stop: $('#ic-stop') };
btn.back.title = TL.back;
btn.forward.title = TL.fwd;
btn.home.title = TL.home;
$('#dlbtn').title = TL.panel;
$('#restart').title = TL.restart;

btn.back.onclick = () => window.navapi.action('back');
btn.forward.onclick = () => window.navapi.action('forward');
btn.home.onclick = () => window.navapi.action('home');
$('#dlbtn').onclick = () => window.navapi.action('panel');
$('#restart').onclick = () => window.navapi.action('restart');

btn.reload.onclick = () => window.navapi.action(btn.reload.dataset.action === 'stop' ? 'stop' : 'reload');

window.navapi.onState((s) => {
  $('#url').value = s.url;
  btn.back.disabled = !s.canBack;
  btn.forward.disabled = !s.canForward;
  ic.refresh.hidden = s.loading;
  ic.stop.hidden = !s.loading;
  btn.reload.title = s.loading ? TL.stop : TL.reload;
  btn.reload.dataset.action = s.loading ? 'stop' : 'reload';
});
</script>
</body>
</html>
